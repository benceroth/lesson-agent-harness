name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build --configuration Release
      - name: Test with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Coverage threshold (Approvals, Limits)
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -Threshold 90
      - name: Vulnerable packages
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
      - name: Attack comparison
        run: dotnet run --configuration Release --no-build --project src/AtlasDesk.Sample -- compare

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
